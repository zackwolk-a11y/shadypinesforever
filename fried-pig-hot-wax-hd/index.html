<title>Fried Pig: Hot Wax</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet. The canvas is the whole show; touch pads dock below it in portrait and float over it in landscape. */
:root{
  --bg:#140b11;        /* cabinet black, warm plum bias */
  --bezel:#24141c;
  --cream:#f2e2b0;     /* Fried Pig Records paper */
  --pink:#f4a7b9;      /* pig */
  --flame:#ffd23f;     /* back flame */
  --ember:#ff8a1f;
  --dung:#8a5a2b;      /* FPR brown */
  --ink:#120a0d;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--cream);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;font-family:var(--pixel);
}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px;box-sizing:border-box}
#screen{position:relative;line-height:0;border:3px solid var(--bezel);box-shadow:0 0 0 3px var(--ink),0 18px 60px rgba(0,0,0,.6);border-radius:4px;overflow:hidden;background:#000}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.13) 3px);mix-blend-mode:multiply}
#legend{font-size:9px;line-height:1.9;letter-spacing:.06em;color:var(--cream);opacity:.72;text-align:center;max-width:100%;text-wrap:balance}
#legend b{color:var(--flame);font-weight:normal}
#brand{display:none;flex:1;min-height:0;align-items:center;justify-content:center;width:100%}
#brand img{max-width:min(70%,260px);max-height:100%;image-rendering:auto;opacity:.92;border-radius:6px}
#pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
body.touch #pad{display:flex}
body.touch #legend{display:none}
#dpad{position:relative;width:150px;height:110px;pointer-events:auto;touch-action:none}
.dk{position:absolute;display:flex;align-items:center;justify-content:center;background:rgba(242,226,176,.12);border:2px solid rgba(242,226,176,.35);color:var(--cream);font-size:16px;border-radius:12px;box-sizing:border-box}
.dk.on{background:rgba(244,167,185,.45);border-color:var(--pink)}
#dl{left:0;top:0;width:70px;height:70px}
#dr{left:80px;top:0;width:70px;height:70px}
#dd{left:45px;top:76px;width:60px;height:34px;font-size:11px}
#btns{position:relative;width:206px;height:150px;pointer-events:auto;touch-action:none}
.bt{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:9px;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45);box-sizing:border-box;letter-spacing:.04em}
.bt.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(1.25)}
#bj{right:0;bottom:0;width:84px;height:84px;background:var(--pink);font-size:10px}
#bf{right:94px;bottom:6px;width:70px;height:70px;background:var(--flame)}
#bp{right:40px;bottom:92px;width:58px;height:58px;background:var(--dung);color:var(--cream)}
#bpause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:6px;width:34px;height:28px;border-radius:6px;background:rgba(0,0,0,.45);border:2px solid rgba(242,226,176,.5);color:var(--cream);font-family:var(--pixel);font-size:9px;display:none;align-items:center;justify-content:center;line-height:1;pointer-events:auto}
body.touch #bpause{display:flex}
body.full #screen{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);border:0;border-radius:0;box-shadow:none;display:flex;align-items:center;justify-content:center;background:#000;z-index:1}
body.full #legend,body.full #brand{display:none!important}
body.full #bpause{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
body.port #screen{margin-inline:-16px;border:0;border-radius:0;box-shadow:none}
#bfull{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:46px;height:28px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.45);border:2px solid rgba(242,226,176,.5);color:var(--cream);font-family:var(--pixel);font-size:8px;display:none;align-items:center;justify-content:center;line-height:1;pointer-events:auto}
body.touch.fsok #bfull{display:flex}
body.full #bfull{top:calc(8px + env(safe-area-inset-top,0px));right:calc(48px + env(safe-area-inset-right,0px))}
#sa{position:fixed;visibility:hidden;pointer-events:none;left:0;top:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (orientation:portrait){
  body.touch #app{justify-content:space-between;padding-block:max(12px,env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
  body.touch #pad{transform:scale(1.05);transform-origin:center bottom;margin-bottom:8px}
  body.touch #bpause{position:fixed;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  body.touch #bfull{position:fixed;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  body.touch #brand{display:flex}
}
@media (orientation:landscape){
  body.touch #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;box-sizing:border-box;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.6;z-index:2}
}
@media (prefers-reduced-motion:reduce){ #scan{display:none} }
</style>

<div id="app">
  <div id="screen">
    <canvas id="game" width="400" height="224" tabindex="0" aria-label="Fried Pig: Hot Wax game screen"></canvas>
    <div id="scan"></div>
    <button id="bpause" type="button" aria-label="Pause">II</button>
    <button id="bfull" type="button" aria-label="Full screen">FULL</button>
  </div>
  <div id="legend"><b>ARROWS</b> run · <b>SPACE</b> jump · <b>X</b> spit fire · <b>C</b> poop · <b>DOWN+SPACE</b> drop · <b>ESC</b> pause · <b>M</b> mute · <b>F</b> full screen</div>
  <div id="sa"></div>
  <div id="brand"><img id="brandImg" alt="Fried Pig Records"></div>
  <div id="pad">
    <div id="dpad"><div class="dk" id="dl">◀</div><div class="dk" id="dr">▶</div><div class="dk" id="dd">▼</div></div>
    <div id="btns"><div class="bt" id="bp">POOP</div><div class="bt" id="bf">FIRE</div><div class="bt" id="bj">JUMP</div></div>
  </div>
</div>

function outline(g,w,h){const id=g.getImageData(0,0,w,h),d=id.data,a=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)a[i]=d[i*4+3]>0?1:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(a[i])continue;
    if((x>0&&a[i-1])||(x<w-1&&a[i+1])||(y>0&&a[i-w])||(y<h-1&&a[i+w])){d[i*4]=OUT[0];d[i*4+1]=OUT[1];d[i*4+2]=OUT[2];d[i*4+3]=255;}}
  g.putImageData(id,0,0);}
function sprite(w,h,draw,post){const [c,g]=mk(w+2,h+2);
  const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x+1,y+1,ww,hh);};
  const E=(cx,cy,rx,ry,col)=>{g.fillStyle=col;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const dy=(y+0.5-cy)/ry;if(Math.abs(dy)>1)continue;const hw=rx*Math.sqrt(1-dy*dy);const x0=Math.round(cx-hw),x1=Math.round(cx+hw);if(x1>x0)g.fillRect(x0+1,y+1,x1-x0,1);}};
  draw(R,E,g);outline(g,w+2,h+2);if(post)post(R,E,g);return c;}

function buildLevel(DEF){const SEGS=DEF.segs;const PINES=DEF.theme==='pines',CRANK=!!DEF.crank;
  const rows=[];for(let r=0;r<14;r++)rows.push([]);const zones=[],flipCol=[];let col=0;
  const L={spawns:[],items:[],hints:[],checkpoints:[],presses:[],props:[],movers:[],start:{x:48,y:160},arenaCol:0,bbCol:0,rares:0,zoneSpans:[],chain:null,hidden:[],calls:[]};
  SEGS.forEach((s,si)=>{const w=Math.max(...s.r.map(r=>r.length));const pad=14-s.r.length;
    const RS=[];for(let r=0;r<14;r++)RS.push((r<pad?'':s.r[r-pad]).padEnd(w,'.'));
    for(const [ps,pc,pr,str] of DEF.place||[])if(ps===si)RS[pr]=RS[pr].slice(0,pc)+str+RS[pr].slice(pc+str.length);
    L.zoneSpans.push({z:s.z,a:col*TS,b:(col+w)*TS});
    for(let r=0;r<14;r++){const src=RS[r];for(let c=0;c<w;c++){let ch=src[c]||'.';const wx=(col+c)*TS,wy=r*TS,gy=(r+1)*TS;
      if(CRANK&&'124567'.includes(ch)){crankProp(L,ch,wx,wy,gy);ch='.';}
      else if(PINES&&'E23456789+?:l'.includes(ch)){if(ch==='?')L.items.push({type:'o',x:wx,y:wy,hidden:true});else if(ch===':')L.hidden.push({r,c:col+c});else if(ch==='l')L.spawns.push({type:'wolf',x:wx,y:wy});else festProp(L,ch,wx,wy,gy);ch='.';}
      else if('scbkx'.includes(ch)){L.spawns.push({type:{s:'suit',c:'chicken',b:'bot',k:'cop',x:'guard'}[ch],x:wx,y:wy});ch='.';}
      else if('oRPAHn&'.includes(ch)){const it={type:ch,x:wx,y:wy};if(ch==='R')it.idx=L.rares++;L.items.push(it);if(ch==='n'){L.props.push({type:'cone',x:wx-16,y:gy-30,w:44,h:30});it.y=gy-46;}ch='.';}
      else if(ch==='!'){L.checkpoints.push({x:wx,y:wy,on:false});ch='.';}
      else if(ch==='@'){L.start={x:wx,y:wy};ch='.';}
      else if(ch==='i'){L.hints.push(wx);ch='.';}
      else if(ch==='Z'){L.arenaCol=col+c;ch='.';}
      else if(ch==='G'){L.bbCol=col+c;ch='.';}
      else if(ch==='V'){L.presses.push({x:wx,col:col+c,row:r});ch='.';}
      else if(PROPCH.includes(ch)){makeProp(L,ch,wx,wy,gy,col+c,r);ch='.';}
      rows[r].push(ch);}}
    for(let c=0;c<w;c++){zones.push(s.z);flipCol.push(!!s.flip);}col+=w;});
  const sp=L.props.filter(p=>p.type==='spillc').sort((a,b)=>a.x-b.x);L.props=L.props.filter(p=>p.type!=='spillc');
  for(let i=0;i<sp.length;){let j=i;while(j+1<sp.length&&sp[j+1].x===sp[j].x+TS&&sp[j+1].y===sp[i].y)j++;const x0=sp[i].x,x1=sp[j].x+TS;L.props.push({type:'spill',x:x0-16,w:x1-x0+16,x0,x1,y:sp[i].y});L.props.push({type:'aisle',x:(x0+x1)/2-26,y:34,w:52,h:20});i=j+1;}
  const doms=L.props.filter(p=>p.type==='dom');if(doms.length)L.chain={on:false,x:0,start:Math.min(...doms.map(d=>d.x))};
  for(const p of L.props)if(p.type==='sprout'){const c=p.col;let top=p.row;while(top>0&&rows[top-1][c]==='.')top--;p.leaves=[[9,c+1],[9,c+2],[6,c-2],[6,c-1],[3,c+1],[3,c+2]].filter(([r])=>r>top);p.hgt=(p.row+1-top)*TS-12;}

  if(b.vx>0){const c=Math.floor((b.x+b.w-0.01)/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=c*TS-b.w;b.vx=0;b.hitR=true;break;}}
  else if(b.vx<0){const c=Math.floor(b.x/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=(c+1)*TS;b.vx=0;b.hitL=true;break;}}

  const c0=Math.floor(b.x/TS),c1=Math.floor((b.x+b.w-0.01)/TS);
  if(b.vy>0){const r=Math.floor((b.y+b.h-0.01)/TS);

        for(let cc=c0;cc<=c1;cc++)if(tileAt(cc,r)==='T'){b.landT='T';b.landC=cc;}break;}}}
  else if(b.vy<0){const r=Math.floor(b.y/TS);
    if(r>=0)for(let c=c0;c<=c1;c++)if(solidAt(c,r)){b.y=(r+1)*TS;b.vy=0;b.hitU=true;b.hitC=c;b.hitRow=r;break;}}
}
function moveX(b,dx){b.x+=dx;const r0=Math.floor(b.y/TS),r1=Math.floor((b.y+b.h-0.01)/TS);
  if(dx>0){const c=Math.floor((b.x+b.w-0.01)/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=c*TS-b.w;break;}}
  else if(dx<0){const c=Math.floor(b.x/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=(c+1)*TS;break;}}}

function sched(){const s=MUS.song;if(!s||!AU.ctx)return;const sp=60/(s.bpm*(MUS.rate||1))/4;let guard=0;
  if(MUS.next<AU.ctx.currentTime-0.5){MUS.next=AU.ctx.currentTime+0.05;}
  while(MUS.next<AU.ctx.currentTime+0.12&&guard++<16){playStep(s,MUS.step,MUS.next,sp);MUS.next+=sp;MUS.step++;}}
function playStep(s,step,t,sp){const d=AU.music,i=step%16,barN=Math.floor(step/16),bar=barN%s.bars.length,root=s.root+s.bars[bar],L=MUS.layers;
  if(s.swing&&(i%4===2))t+=sp*0.33;
  const dr=(bar===s.bars.length-1)?s.fill:s.dr;
  if(dr.k[i]==='x')I.kick(t,d);if(dr.s[i]==='x')I.snare(t,d);if(dr.h[i]==='x')I.hat(t,d,false);if(dr.z&&dr.z[i]==='x')I.scratch(t,d);if(dr.c&&dr.c[i]==='x')I.clank(t,d);

  if(L>=3){const c=s.gtr[i];if(c==='x')I.guitar(t,root+12,sp*0.9,d,false);else if(c==='X')I.guitar(t,root+12,sp*3.6,d,true);}
  if(L>=4){const bs=s.lead[barN%s.lead.length];const c=bs[i];if(c&&c!=='.'&&c!=='-'){let n=1;while(i+n<16&&bs[i+n]==='-')n++;const idx=parseInt(c,36);I.lead(t,s.leadBase+s.scale[idx%s.scale.length],sp*n*0.95,d);}}

function updateEnemy(e){
  const p=P;
  if(e.dead){e.vy+=0.35;e.y+=e.vy;e.x+=e.vx;e.rot=(e.rot||0)+0.25;if(e.y>H+40)e.remove=true;return;}

  const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h/2)-(e.y+e.h/2),adx=Math.abs(dx);
  if(e.sliding){e.vx=e.slideV;e.vy=Math.min(e.vy+0.4,7);moveBody(e);if(e.t%3===0)part(e.x+6,e.y+e.h,rand(-0.5,0.5),-0.3,12,'#cfe8ff',1,0);if(e.hitL||e.hitR){e.sliding=false;e.stuck=150;e.dizzy=true;e.vx=0;pop(e.x-6,e.y-12,'BONK!','#fff');sfx.stomp();}}
  else if(e.stuck>0){e.stuck--;e.vx=0;e.vy=Math.min(e.vy+0.4,7);moveBody(e);if(!e.dizzy&&e.t%8===0)part(e.x+rand(0,e.w),e.y+rand(0,8),rand(-0.3,0.3),-0.6,30,'#8a9a40',1,-0.01);if(e.stuck===0){if(!e.dizzy)pop(e.x,e.y-8,'UNSTUCK','#c8945a');e.dizzy=false;}}
  else switch(e.type){

      if(e.state==='wind'){e.vx=0;e.wt--;e.face=sign(dx)||e.face;if(e.wt<=0){e.state=null;e.cd=rand(95,150);e.throwN=(e.throwN||0)+1;sfx.throwit();
        if(e.throwN%2){eproj.push({kind:'case',x:e.x+e.w/2-4,y:e.y+4,w:8,h:7,vx:clamp(dx/42,-3.2,3.2),vy:-4.6,grav:0.22,life:200,t:0});}

function updateShots(){

    else{s.vx*=0.96;s.vy-=0.03;}
    if(propShotHit(s)){s.life=0;continue;}
    if(bossShotHit(s)){s.life=0;continue;}
    const c=Math.floor((s.x+s.w/2)/TS),r=Math.floor((s.y+s.h/2)/TS);
    if(solidAt(c,r)&&r>=0&&c>=0&&c<LV.w){const t=tileAt(c,r);if(s.kind==='ball'){damageTile(c,r,1);burst(s.x+4,s.y+3,6,['#ffd23f','#ff8a1f'],1.5,14,1);s.life=0;}else{if((t==='B'||t==='W'||t==='K')&&!LV.flameCd){damageTile(c,r,1);LV.flameCd=8;}s.life=0;}}
    if(s.life<=0)continue;
    for(const e of ents){if(e.dead||!e.active)continue;if(overlap(s,e)){if(s.kind==='ball'){hurtEnemy(e,1,sign(s.vx));s.life=0;burst(s.x+4,s.y+3,8,['#ffd23f','#ff8a1f','#fff'],2,16,2);break;}else if(e.flameCd<=0){e.flameCd=7;hurtEnemy(e,1,sign(s.vx));}}}

    for(const q of poops){if(!q.gone&&overlap(s,q)){q.gone=true;explode(q.x+5,q.y+4);s.life=0;break;}}
    if(s.life<=0)continue;
    for(const q of eproj){if(q.life>0&&overlap(s,q)&&q.kind!=='wave'&&q.kind!=='smoke'&&q.kind!=='crate'&&q.kind!=='swave'){if(q.kind==='spk'&&spkHit(q,s))break;if(q.kind==='sauce'){q.fuse=1;q.grav=0;q.vx=0;q.vy=0;if(s.kind==='ball')s.life=0;break;}q.life=0;burst(q.x+4,q.y+4,8,q.kind==='paper'?['#fafafa','#ff8a1f','#444']:['#ffd23f','#5ff','#fff'],1.8,18,2);if(q.kind==='paper')pop(q.x-6,q.y-8,'VOID!','#fafafa');if(q.kind==='vinyl'&&Math.random()<0.35)spawnRecord(q.x+6,q.y+6,rand(-1,1),-3);if(s.kind==='ball')s.life=0;sfx.hit();break;}}
    if(s.life<=0)continue;
  }
  if(LV.flameCd)LV.flameCd--;

  for(const q of eproj){q.t++;q.life--;q.vy+=q.grav||0;

const ATMN={rain:70,dust:26,leaves:14,embers:30,fire:22,pollen:24,spores:28,glints:18,notes:10,sparks:10};
function hdAtmosphere(){const k=hdAtmKind();const dc=G.cam-HD.lastCam;HD.lastCam=G.cam;if(Math.abs(dc)>200)HD.atm=[];
  if(k!==HD.atmKind){HD.atmKind=k;HD.atm=HD.atm.filter(q=>q.k===k);}const n=ATMN[k]||0;while(HD.atm.length<n)HD.atm.push(atmSpawn(k,HD.atm.length<n-2&&G.t%2===0?true:HD.atm.length===0));

  if(fogA&&(LV.def.theme!=='pines'||fz==='cd'||pinesSky().dark>0.2)){if(!HD.fog){const [c,g]=mk(512,48);for(let x=0;x<512;x++){const top=14+Math.round(Math.sin(x*0.021)*5+Math.sin(x*0.057+2)*3);for(let y=top;y<48;y++){const t=(y-top)/(48-top);const lv=t<0.25?0.35:t<0.6?0.6:1;g.globalAlpha=lv;g.fillRect(x,y,1,1);}}g.globalAlpha=1;HD.fog=c;}
    ctx.globalAlpha=fogA;const fo=-Math.round(G.cam*0.7+G.t*0.25)%512;const fc=fz==='cd'?'#c8b8ff':'#d8d8e8';ctx.drawImage(tintC(HD.fog,fc),fo,H-60);ctx.drawImage(tintC(HD.fog,fc),fo+512,H-60);ctx.globalAlpha=1;}}

function hdLedgeShadows(){const c0=Math.max(0,Math.floor(G.cam/TS)),c1=Math.min(LV.w-1,c0+Math.ceil(W/TS)+1),ox=-Math.round(G.cam),S=hdShadowSpr();

function ramp(base){const c=hexRGB(base);const m=(f,a)=>'#'+c.map(v=>Math.round(clamp(v*f+a,0,255)).toString(16).padStart(2,'0')).join('');return{H:m(1.18,40),L:m(1.08,14),B:base,S:m(0.72,0),D:m(0.48,0),O:m(0.22,8)};}
function pixBuf(w,h){const b=new Array(w*h).fill(null);return{w,h,b,set(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)b[y*w+x]=c;},get(x,y){return(x>=0&&y>=0&&x<w&&y<h)?b[y*w+x]:null;},
  rect(x,y,ww,hh,c){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)this.set(x+i,y+j,c);},
  shadedRect(x,y,ww,hh,R){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++){const c=i===0?R.L:i===ww-1?R.S:j===0?R.L:j===hh-1?R.S:R.B;this.set(x+i,y+j,c);}if(ww>2&&hh>2)this.set(x,y,R.H);}}};
function bufOut(pb,outCol,pad=1,selTop){const {w,h,b}=pb;const W2=w+pad*2,H2=h+pad*2;const [c,g]=mk(W2,H2);
  const has=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&b[y*w+x];
  for(let y=-pad;y<h+pad;y++){let run=null,st=0;for(let x=-pad;x<=w+pad;x++){let col=null;if(x<w+pad){if(has(x,y))col=b[y*w+x];else if(has(x-1,y)||has(x+1,y)||has(x,y-1)||has(x,y+1))col=(selTop&&y<h*0.35)?selTop:outCol;}
      if(col!==run){if(run){g.fillStyle=run;g.fillRect(st+pad,y+pad,x-st,1);}run=col;st=x;}}}
  return c;}
/* --- humanoid builder (18x26 canvas -> 20x28 with outline, same as sprite()) --- */

  leg(5,sw[0]*2,pn,6);leg(10,sw[1]*2,pn,6);

  else{if(!o.shades){pb.set(ex,ey,'#fff');pb.set(ex,ey+1,'#14101a');pb.set(ex+3,ey,'#fff');pb.set(ex+3,ey+1,'#14101a');}
    if(ang){pb.set(ex-1,ey-1,'#14101a');pb.set(ex,ey-1,'#14101a');pb.set(ex+3,ey-1,'#14101a');pb.set(ex+4,ey-1,'#14101a');pb.rect(ex,ey+4,4,1,'#3a0a14');pb.set(ex+1,ey+4,'#fff6e8');pb.set(ex+2,ey+4,'#fff6e8');}

function danceTime(){const D=G.dance;if(AU.ctx&&MUS.song&&MUS.id===20)return AU.ctx.currentTime-MUS.start;return(performance.now()-D.p0)/1000;}
function startDance(band,retry){const p=P;G.mode='dance';p.vx=0;p.face=1;p.lockT=0;sfx.flame(false);
