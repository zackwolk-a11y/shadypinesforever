<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The 333 Dimensions of Madness</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07040b;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#screen{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 40px #3b0d55}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,90,200,.22) 60%,rgba(80,0,90,.25));border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(0,0,0,.35);color:#fff;font:900 15px 'Arial Black',Impact,sans-serif;letter-spacing:1px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000}
.tb.down{background:rgba(120,255,80,.45)}
#stick{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.4);pointer-events:auto}
.tb[data-a=jump]{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(90,230,60,.28) 60%,rgba(0,60,0,.25))}
.tb[data-a=pause]{font-size:12px;opacity:.7}
#rotate{position:fixed;left:0;right:0;top:12px;text-align:center;color:#7fff3a;font:bold 14px monospace;display:none;text-shadow:0 2px 0 #000}
@media (orientation:portrait) and (max-width:900px){#rotate{display:block}}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="360"></canvas></div>
<div id="rotate">ROTATE YOUR DEVICE FOR THE FULL MADNESS ↻</div>
<div id="touch"><div id="stick"><div id="knob"></div></div></div>
<script>
/*__GAME__*/
</script>
</body>
</html>
