<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#18131c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SIMPS: Goose on the Loose!</title>
  <style>
    html, body { margin: 0; height: 100%; background: #18131c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #18131c; color: #fff; font: bold 16px monospace; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">🪿 Rotate your device to landscape<br/>to play SIMPS: GOOSE ON THE LOOSE!</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
