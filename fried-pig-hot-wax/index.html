<title>Fried Pig: Hot Wax</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen arcade cabinet. The canvas is the whole show; touch pads dock below it in portrait and float over it in landscape. */
:root{
  --bg:#140b11;        /* cabinet black, warm plum bias */
  --bezel:#24141c;
  --cream:#f2e2b0;     /* Fried Pig Records paper */
  --pink:#f4a7b9;      /* pig */
  --flame:#ffd23f;     /* back flame */
  --ember:#ff8a1f;
  --dung:#8a5a2b;      /* FPR brown */
  --ink:#120a0d;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--cream);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;font-family:var(--pixel);
}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px;box-sizing:border-box}
#screen{position:relative;line-height:0;border:3px solid var(--bezel);box-shadow:0 0 0 3px var(--ink),0 18px 60px rgba(0,0,0,.6);border-radius:4px;overflow:hidden;background:#000}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.13) 3px);mix-blend-mode:multiply}
#legend{font-size:9px;line-height:1.9;letter-spacing:.06em;color:var(--cream);opacity:.72;text-align:center;max-width:100%;text-wrap:balance}
#legend b{color:var(--flame);font-weight:normal}
#brand{display:none;flex:1;min-height:0;align-items:center;justify-content:center;width:100%}
#brand img{max-width:min(70%,260px);max-height:100%;image-rendering:auto;opacity:.92;border-radius:6px}
#pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
body.touch #pad{display:flex}
body.touch #legend{display:none}
#dpad{position:relative;width:150px;height:110px;pointer-events:auto;touch-action:none}
.dk{position:absolute;display:flex;align-items:center;justify-content:center;background:rgba(242,226,176,.12);border:2px solid rgba(242,226,176,.35);color:var(--cream);font-size:16px;border-radius:12px;box-sizing:border-box}
.dk.on{background:rgba(244,167,185,.45);border-color:var(--pink)}
#dl{left:0;top:0;width:70px;height:70px}
#dr{left:80px;top:0;width:70px;height:70px}
#dd{left:45px;top:76px;width:60px;height:34px;font-size:11px}
#btns{position:relative;width:206px;height:150px;pointer-events:auto;touch-action:none}
.bt{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:9px;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45);box-sizing:border-box;letter-spacing:.04em}
.bt.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(1.25)}
#bj{right:0;bottom:0;width:84px;height:84px;background:var(--pink);font-size:10px}
#bf{right:94px;bottom:6px;width:70px;height:70px;background:var(--flame)}
#bp{right:40px;bottom:92px;width:58px;height:58px;background:var(--dung);color:var(--cream)}
#bpause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:6px;width:34px;height:28px;border-radius:6px;background:rgba(0,0,0,.45);border:2px solid rgba(242,226,176,.5);color:var(--cream);font-family:var(--pixel);font-size:9px;display:none;align-items:center;justify-content:center;line-height:1;pointer-events:auto}
body.touch #bpause{display:flex}
@media (orientation:portrait){
  body.touch #app{justify-content:space-between;padding-block:max(12px,env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
  body.touch #pad{transform:scale(1.05);transform-origin:center bottom;margin-bottom:8px}
  body.touch #bpause{position:fixed;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  body.touch #brand{display:flex}
}
@media (orientation:landscape){
  body.touch #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;box-sizing:border-box;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.82}
}
@media (prefers-reduced-motion:reduce){ #scan{display:none} }
</style>

<div id="app">
  <div id="screen">
    <canvas id="game" width="400" height="224" tabindex="0" aria-label="Fried Pig: Hot Wax game screen"></canvas>
    <div id="scan"></div>
    <button id="bpause" type="button" aria-label="Pause">II</button>
  </div>
  <div id="legend"><b>ARROWS</b> run · <b>SPACE</b> jump · <b>X</b> spit fire · <b>C</b> poop · <b>DOWN+SPACE</b> drop · <b>ESC</b> pause · <b>M</b> mute</div>
  <div id="brand"><img id="brandImg" alt="Fried Pig Records"></div>
  <div id="pad">
    <div id="dpad"><div class="dk" id="dl">◀</div><div class="dk" id="dr">▶</div><div class="dk" id="dd">▼</div></div>
    <div id="btns"><div class="bt" id="bp">POOP</div><div class="bt" id="bf">FIRE</div><div class="bt" id="bj">JUMP</div></div>
  </div>
</div>

function circ(g,cx,cy,r,c){g.fillStyle=c;for(let dy=-r;dy<=r;dy++){const hw=Math.floor(Math.sqrt(r*r-dy*dy)+0.5);g.fillRect(Math.round(cx-hw),Math.round(cy+dy),hw*2+1,1);}}
function ring(g,cx,cy,r,c){g.fillStyle=c;const n=Math.max(8,Math.ceil(r*6.3));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}
function line(g,x0,y0,x1,y1,c,t=1){g.fillStyle=c;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){g.fillRect(Math.round(x0+(x1-x0)*i/n-(t>>1)),Math.round(y0+(y1-y0)*i/n-(t>>1)),t,t);}}

  for(let i=0;i<s.length;i++){if(s[i]!==' ')g.drawImage(glyph(s[i],col),x+i*6*sc,y,5*sc,7*sc);}}

function outline(g,w,h){const id=g.getImageData(0,0,w,h),d=id.data,a=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)a[i]=d[i*4+3]>0?1:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(a[i])continue;
    if((x>0&&a[i-1])||(x<w-1&&a[i+1])||(y>0&&a[i-w])||(y<h-1&&a[i+w])){d[i*4]=OUT[0];d[i*4+1]=OUT[1];d[i*4+2]=OUT[2];d[i*4+3]=255;}}
  g.putImageData(id,0,0);}
function sprite(w,h,draw,post){const [c,g]=mk(w+2,h+2);
  const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x+1,y+1,ww,hh);};
  const E=(cx,cy,rx,ry,col)=>{g.fillStyle=col;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const dy=(y+0.5-cy)/ry;if(Math.abs(dy)>1)continue;const hw=rx*Math.sqrt(1-dy*dy);const x0=Math.round(cx-hw),x1=Math.round(cx+hw);if(x1>x0)g.fillRect(x0+1,y+1,x1-x0,1);}};
  draw(R,E,g);outline(g,w+2,h+2);if(post)post(R,E,g);return c;}
const flashCache=new WeakMap();
function flashOf(c){let f=flashCache.get(c);if(f)return f;const [fc,g]=mk(c.width,c.height);g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);flashCache.set(c,fc);return fc;}
function drawSpr(g,c,x,y,flip,flash){x=Math.round(x);y=Math.round(y);const s=flash?flashOf(c):c;
  if(flip){g.save();g.translate(x+c.width,y);g.scale(-1,1);g.drawImage(s,0,0);g.restore();}else g.drawImage(s,x,y);}

function drawFlameOn(g,t,mult,hot,pulse){
  const cols=[];
  for(let sx=4;sx<=21;sx++){
    const yTop=11-6.5*Math.sqrt(Math.max(0,1-((sx+0.5-13)/10)**2));
    const per=6,frac=(((sx-t*0.35)%per)+per)%per/per;
    const env=0.55+0.45*Math.sin(Math.PI*(sx-4)/17);
    const hgt=Math.max(2,Math.round((2.5+11*frac)*env*mult*(0.85+0.35*pulse)+(Math.random()<0.15?1:0)));
    cols.push([9+sx,Math.round(yTop)+27+2,hgt,frac]);
  }
  for(const [x,y,h] of cols)rf(g,x-1,y-h-1,3,h+3,OUTC);
  const Y=hot?'#ffe27a':'#ffd23f',O=hot?'#ff3b1f':'#ff8a1f',T=hot?'#ffffff':'#fff3a0';
  for(const [x,y,h,f] of cols){rf(g,x,y-h,1,h+2,Y);rf(g,x,y-Math.round(h*0.4),1,Math.round(h*0.4)+2,O);if(f>0.7)rf(g,x,y-h,1,1,T);}
}

function moveBody(b){

  b.x+=b.vx;
  const r0=Math.floor(b.y/TS),r1=Math.floor((b.y+b.h-0.01)/TS);
  if(b.vx>0){const c=Math.floor((b.x+b.w-0.01)/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=c*TS-b.w;b.vx=0;b.hitR=true;break;}}
  else if(b.vx<0){const c=Math.floor(b.x/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=(c+1)*TS;b.vx=0;b.hitL=true;break;}}
  const prevBottom=b.y+b.h;b.y+=b.vy;
  const c0=Math.floor(b.x/TS),c1=Math.floor((b.x+b.w-0.01)/TS);
  if(b.vy>0){const r=Math.floor((b.y+b.h-0.01)/TS);
    for(let c=c0;c<=c1;c++){const t=tileAt(c,r);const sol=solidAt(c,r)&&r>=0;
      if(sol||(t==='='&&prevBottom<=r*TS+0.5&&!b.drop)){b.y=r*TS-b.h;b.vy=0;b.onGround=true;b.landT=t;b.landC=c;b.landR=r;
        for(let cc=c0;cc<=c1;cc++)if(tileAt(cc,r)==='T'){b.landT='T';b.landC=cc;}break;}}}
  else if(b.vy<0){const r=Math.floor(b.y/TS);
    if(r>=0)for(let c=c0;c<=c1;c++)if(solidAt(c,r)){b.y=(r+1)*TS;b.vy=0;b.hitU=true;b.hitC=c;b.hitRow=r;break;}}
}

const G={mode:'splash',t:0,cam:0,shake:0,touchUI:false,muted:!!SV.muted,menuSel:0,banner:null,hintsShown:0,tap:null,splashT:0};
let P,ents,shots,eproj,poops,items,parts,pops,boss,arena,bb,stats;
function newGame(){
  LV=buildLevel();
  G.lives=3;G.records=0;G.layers=1;G.rareRun=[false,false,false];G.hintsShown=0;G.banner=null;G.cpIndex=-1;
  stats={time:0,kills:0,poops:0,deaths:0,fires:0};
  items=LV.items.map(it=>({...it,w:it.type==='R'?14:it.type==='H'?18:12,h:it.type==='R'?14:12,t:Math.random()*10,taken:false}));
  for(const it of items){it.x+=(TS-it.w)/2;it.y+=(TS-it.h)/2;it.by=it.y;}
  G.respawn={x:LV.start.x,y:LV.start.y};arena=null;boss=null;
  bb={x:LV.bbCol*TS,y:0,burn:0,fall:0,angle:0,state:'stand'};
  resetRun(true);
  G.mode='play';G.t=0;
  playSong(0,1);
}
function resetRun(first){
  P={x:G.respawn.x,y:G.respawn.y+TS-15,w:20,h:15,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,jumpsLeft:0,canDouble:first?false:P.canDouble,
     hp:3,inv:first?0:90,fireCd:0,pepper:0,poop:first?3:Math.max(3,P.poop),poopRegen:0,poopCd:0,anim:0,dead:false,drop:0,squash:0,mouth:0,spin:0,lockT:0};
  ents=LV.spawns.filter(s=>!s.killed&&s.x>G.respawn.x+80).map(s=>makeEnemy(s));
  shots=[];eproj=[];poops=[];parts=[];pops=[];
  items=items.filter(i=>!i.dyn);
  arena={started:false,done:arena&&arena.done,x:LV.arenaCol*TS};
  if(!arena.done){for(let r=0;r<12;r++)LV.t[r][LV.arenaCol]='.';boss=null;}
  G.cam=clamp(P.x-W/2,0,LV.w*TS-W);
  if(!first)playSong(arena.done?0:0,G.layers);
}
function makeEnemy(s){const d={suit:[12,24],cop:[12,24],chicken:[12,11],bot:[16,14]}[s.type];
  const e={src:s,type:s.type,w:d[0],h:d[1],x:s.x+(TS-d[0])/2,y:s.y+TS-d[1],vx:0,vy:0,face:-1,hp:{suit:2,cop:3,chicken:1,bot:1}[s.type],t:Math.random()*100|0,cd:60+Math.random()*60,flash:0,stuck:0,flameCd:0,dead:false,active:false,spd:rand(0.85,1.2)};
  if(s.type==='bot'){e.baseY=e.y;}return e;}

/* ================= effects ================= */
function part(x,y,vx,vy,life,col,size=1,grav=0.15,kind){if(parts.length>500)parts.shift();parts.push({x,y,vx,vy,life,max:life,col,size,grav,kind});}
function burst(x,y,n,cols,spd=2,life=30,size=2,grav=0.15){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd;part(x,y,Math.cos(a)*s,Math.sin(a)*s-spd*0.3,life*rand(0.6,1.2),pick(cols),size,grav);}}
function pop(x,y,txt,col='#ffd23f'){pops.push({x,y,txt,col,life:55});}
function banner(txt,sub,life=170,col='#ffd23f'){G.banner={txt,sub,life,max:life,col};}
function shake(n){G.shake=Math.max(G.shake,n);}

/* ================= player ================= */
function updatePlayer(){
  const p=P;if(p.dead)return;
  const cut=p.lockT>0;if(cut)p.lockT--;
  const L=!cut&&down('left'),Rt=!cut&&down('right');
  const acc=p.onGround?0.38:0.27,max=2.7;
  if(L&&!Rt){p.vx-=acc;p.face=-1;}else if(Rt&&!L){p.vx+=acc;p.face=1;}
  else{const f=p.onGround?0.3:0.07;if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=sign(p.vx)*f;}
  p.vx=clamp(p.vx,-max,max);
  if(!cut&&(hit('jump')||hit('up')))p.jumpBuf=7;
  if(p.onGround){p.coyote=6;p.jumpsLeft=p.canDouble?1:0;}else if(p.coyote>0)p.coyote--;
  if(p.jumpBuf>0){p.jumpBuf--;
    if(down('down')&&p.onGround&&p.landT==='='){p.drop=12;p.jumpBuf=0;p.y+=2;p.onGround=false;}
    else if(p.coyote>0){p.vy=-6.8;p.coyote=0;p.jumpBuf=0;p.onGround=false;p.squash=-6;sfx.jump();for(let i=0;i<5;i++)part(p.x+p.w/2,p.y+p.h,rand(-1,1),rand(-0.8,0),16,'#cfc2d0',2,0.02);}
    else if(p.jumpsLeft>0){p.vy=-6.1;p.jumpsLeft--;p.jumpBuf=0;p.spin=20;sfx.dbl();for(let i=0;i<10;i++)part(p.x+p.w/2,p.y+p.h,rand(-2,2),rand(0.5,2),20,pick(['#fafafa','#ffd23f','#ff8a1f']),2,0.05);}}
  const holding=down('jump')||down('up')||p.boost;
  if(p.vy>=0)p.boost=false;
  const g=p.vy<0?(holding?0.36:0.95):0.42;
  p.vy=Math.min(p.vy+g,7.5);
  p.drop=p.drop>0?p.drop-1:0;
  const wasAir=!p.onGround,vyBefore=p.vy;
  moveBody(p);
  if(p.onGround&&wasAir&&vyBefore>3){p.squash=6;for(let i=0;i<6;i++)part(p.x+p.w/2+rand(-8,8),p.y+p.h-1,rand(-1.2,1.2),rand(-0.6,0),18,'#cfc2d0',2,0.02);}
  if(p.onGround&&p.landT==='T'){p.vy=-10.6;p.boost=true;p.onGround=false;p.jumpsLeft=p.canDouble?1:0;p.squash=-8;sfx.boing();LV.bounceT={c:p.landC,t:12};}
  if(p.hitU&&tileAt(p.hitC,p.hitRow)==='B'){breakTile(p.hitC,p.hitRow,true);}
  // hazards
  if(!p.inv){const r=Math.floor((p.y+p.h-3)/TS);for(let c=Math.floor((p.x+3)/TS);c<=Math.floor((p.x+p.w-3)/TS);c++)if(tileAt(c,r)==='^'&&p.y+p.h>r*TS+8){hurtPlayer(p.x+p.w/2-p.face);p.vy=-5.5;break;}}
  // fire
  if(p.fireCd>0)p.fireCd--;if(p.mouth>0)p.mouth--;
  if(p.pepper>0){p.pepper--;if(!cut&&down('fire')){p.mouth=4;for(let i=0;i<2;i++){const mx=p.face>0?p.x+p.w+2:p.x-2;shots.push({kind:'flame',x:mx-3,y:p.y+3+rand(-2,2),w:6,h:6,vx:p.face*rand(3.6,5)+p.vx*0.5,vy:rand(-0.5,0.4),life:irand(16,24),t:0});}sfx.flame(true);}else sfx.flame(false);
    if(p.pepper===0){sfx.flame(false);pop(p.x,p.y-10,'PEPPER GONE','#ff8a1f');}}
  else if(!cut&&down('fire')&&p.fireCd===0&&shots.filter(s=>s.kind==='ball').length<3){p.fireCd=13;p.mouth=8;stats.fires++;
    const mx=p.face>0?p.x+p.w:p.x-8;shots.push({kind:'ball',x:mx,y:p.y+3,w:8,h:7,vx:p.face*4.3+p.vx*0.35,vy:0,life:70,t:0});sfx.fire();}
  // poop
  if(p.poopCd>0)p.poopCd--;
  if(!cut&&hit('poop')&&p.poopCd===0){
    if(p.poop>=1){p.poop--;p.poopCd=18;stats.poops++;const hot=p.pepper>0;
      poops.push({x:p.face>0?p.x-6:p.x+p.w-4,y:p.y+p.h-9,w:10,h:8,vx:-p.face*0.8+p.vx*0.3,vy:p.onGround?-1.5:0.5,life:900,hot,fuse:hot?80:0,t:0,onGround:false});
      sfx.poop();pop(p.x+p.w/2-10,p.y-12,pick(['PLOP!','BRAAP!','PFFT!','SPLAT!','TOOT!']),'#c8945a');p.squash=4;
      for(let i=0;i<4;i++)part(p.x+(p.face>0?0:p.w),p.y+p.h-6,-p.face*rand(0.2,1),rand(-1,0),22,'#9a8a50',2,-0.02);}
    else{pop(p.x,p.y-12,'EMPTY! EAT APPLES','#c8945a');sfx.blip(120,0.12);p.poopCd=20;}}
  if(p.poop<5){if(++p.poopRegen>=720){p.poopRegen=0;p.poop++;}}else p.poopRegen=0;
  if(p.inv>0)p.inv--;if(p.squash)p.squash-=sign(p.squash);if(p.spin>0)p.spin--;
  p.anim+=Math.abs(p.vx)*0.09+0.02;
  // flame embers
  if(G.t%3===0){const bx=p.face>0?p.x+4:p.x+p.w-4;part(bx+rand(-4,4),p.y-6+rand(-3,3),-p.face*rand(0.2,0.8)-p.vx*0.2,rand(-1.2,-0.4),irand(10,22),pick(p.pepper?['#ff3b1f','#ffe27a','#fff']:['#ffd23f','#ff8a1f']),1,-0.02);}
  if(p.y>H+24)killPlayer(true);
}
function hurtPlayer(fromX){const p=P;if(p.inv>0||p.dead||G.mode!=='play')return;p.hp--;p.inv=100;p.vx=(p.x+p.w/2<fromX?-1:1)*3;p.vy=-4;p.onGround=false;sfx.hurt();shake(4);
  pop(p.x,p.y-12,pick(['OINK!','SQUEE!','OW, MY HAM!','REEEE!']),'#f4a7b9');burst(p.x+10,p.y+6,8,['#f4a7b9','#fff'],2,20,2);
  if(p.hp<=0)killPlayer(false);}
function killPlayer(pit){const p=P;if(p.dead)return;p.dead=true;p.hp=0;stats.deaths++;G.lives--;G.mode='dying';G.dieT=0;sfx.flame(false);sfx.die();stopSong();
  if(!pit){p.vy=-7;p.vx=0;}shake(6);}
function updateDying(){G.dieT++;const p=P;if(p.y<H+60){p.vy=Math.min(p.vy+0.35,8);p.y+=p.vy;}
  if(G.dieT>130){if(G.lives>0){resetRun(false);G.mode='play';banner(G.lives===1?'LAST PIG!':G.lives+' PIGS LEFT','',110,'#f4a7b9');}else{G.mode='gameover';G.menuSel=0;G.goT=0;}}}

/* ================= tiles: damage/break ================= */
function damageTile(c,r,n){const t=tileAt(c,r);if(t==='B'){LV.dmg[r][c]+=n;if(LV.dmg[r][c]>=2)breakTile(c,r,false);else{sfx.crunch();burst(c*TS+8,r*TS+8,5,['#ff8a1f','#ffd23f'],1.5,18,1);}return true;}
  if(t==='W'){LV.dmg[r][c]+=n;burst(c*TS+8,r*TS+4,5,['#6a3a8a','#3b1d4a','#ff8a1f'],1.5,22,2,0.25);sfx.sizzle();if(LV.dmg[r][c]>=3){LV.t[r][c]='.';burst(c*TS+8,r*TS+8,14,['#6a3a8a','#3b1d4a','#8a5aaa'],2.2,30,2,0.3);pop(c*TS-4,r*TS,'MELTED!','#c89aff');}return true;}return false;}
function breakTile(c,r,head){LV.t[r][c]='.';sfx.crunch();burst(c*TS+8,r*TS+8,14,['#c08a4a','#8a5a2a','#e8d8a0','#ff8a1f'],2.5,30,2,0.25);
  const n=head?2:2;for(let i=0;i<n;i++)spawnRecord(c*TS+8,r*TS+4,rand(-1.6,1.6),rand(-4.5,-2.5));pop(c*TS-6,r*TS-4,head?'HEADBUTT!':'ROASTED!','#ffd23f');}
function spawnRecord(x,y,vx,vy){items.push({type:'o',dyn:true,x:x-6,y:y-6,w:12,h:12,vx,vy,t:Math.random()*10,life:600,taken:false,onGround:false});}
function explode(x,y,r=42){sfx.boom();shake(8);pop(x-24,y-20,pick(['KA-POOM!','KA-BLOOEY!','DOO-DOO BOOM!']),'#ff8a1f');
  for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,s=rand(0.5,3.5);part(x,y,Math.cos(a)*s,Math.sin(a)*s-1,rand(20,45),pick(['#ff8a1f','#ffd23f','#7a4a1e','#a0682e','#fff3a0']),irand(2,4),0.08);}
  for(let i=0;i<10;i++)part(x+rand(-15,15),y+rand(-10,10),rand(-0.4,0.4),rand(-1,-0.3),rand(40,70),'#6a5a40',4,-0.01,'smoke');
  for(const e of ents){if(e.dead||!e.active)continue;const dx=e.x+e.w/2-x,dy=e.y+e.h/2-y;if(dx*dx+dy*dy<r*r)hurtEnemy(e,3,sign(dx)||1);}
  if(boss&&boss.state!=='dying'&&boss.state!=='dead'){const dx=boss.x+boss.w/2-x,dy=boss.y+boss.h/2-y;if(Math.abs(dx)<r+boss.w/2&&Math.abs(dy)<r+boss.h/2)bossHurt(4);}
  for(let rr=Math.floor((y-r)/TS);rr<=Math.floor((y+r)/TS);rr++)for(let c=Math.floor((x-r)/TS);c<=Math.floor((x+r)/TS);c++){const t=tileAt(c,rr);const dx=c*TS+8-x,dy=rr*TS+8-y;if(dx*dx+dy*dy<r*r){if(t==='B')breakTile(c,rr,false);else if(t==='W'){LV.dmg[rr][c]=3;LV.t[rr][c]='.';burst(c*TS+8,rr*TS+8,8,['#6a3a8a','#3b1d4a'],2,25,2,0.3);}}}}

/* ================= enemies ================= */
const DEATH_TXT={suit:['FIRED!','DOWNSIZED!','LAID OFF!','DEAL OFF!'],cop:['CASE DISMISSED!','FAIR USE!','OVERRULED!'],chicken:['BAWK!','FRIED!','NUGGETS!'],bot:['BUFFERING...','404!','UNSUBSCRIBED!','DISCONNECTED!']};
function hurtEnemy(e,n,dir){if(e.dead)return;if(e.stuck>0)n=99;e.hp-=n;e.flash=6;if(e.hp<=0){killEnemy(e,dir);}else{sfx.hit();e.vx=dir*1.5;if(e.type!=='bot')e.vy=-2;}}
function killEnemy(e,dir){e.dead=true;e.vy=-5;e.vx=dir*2;e.rot=0;stats.kills++;e.src.killed=true;sfx.kill();
  pop(e.x-8,e.y-10,pick(DEATH_TXT[e.type]),e.type==='bot'?'#5ff':'#ffd23f');
  if(e.type==='chicken')burst(e.x+6,e.y+5,14,['#fafafa','#e8e8e8','#e8283a'],2,40,2,0.04);
  else if(e.type==='bot')burst(e.x+8,e.y+7,12,['#5ff','#c7d0dd','#ffd23f'],2.5,25,2);
  else{burst(e.x+6,e.y+10,10,['#fafafa','#ffd23f'],2,30,2,0.1);if(Math.random()<0.6)spawnRecord(e.x+6,e.y,rand(-1,1),-4);}
  if(Math.random()<0.08)items.push({type:'A',dyn:true,x:e.x,y:e.y,w:12,h:12,vx:0,vy:-3,t:0,life:600,taken:false});}
function updateEnemy(e){
  const p=P;
  if(e.dead){e.vy+=0.35;e.y+=e.vy;e.x+=e.vx;e.rot=(e.rot||0)+0.25;if(e.y>H+40)e.remove=true;return;}
  if(!e.active){if(e.x<G.cam+W+48&&e.x+e.w>G.cam-48)e.active=true;else return;}
  if(e.x>G.cam+W+200||e.x<G.cam-260){return;}
  e.t++;if(e.flash>0)e.flash--;if(e.flameCd>0)e.flameCd--;
  const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h/2)-(e.y+e.h/2),adx=Math.abs(dx);
  if(e.stuck>0){e.stuck--;e.vx=0;e.vy=Math.min(e.vy+0.4,7);moveBody(e);if(e.t%8===0)part(e.x+rand(0,e.w),e.y+rand(0,8),rand(-0.3,0.3),-0.6,30,'#8a9a40',1,-0.01);if(e.stuck===0)pop(e.x,e.y-8,'UNSTUCK','#c8945a');}
  else switch(e.type){
    case 'suit':{
      if(e.state==='wind'){e.vx=0;e.wt--;e.face=sign(dx)||e.face;if(e.wt<=0){e.state=null;e.cd=rand(95,150);e.throwN=(e.throwN||0)+1;sfx.throwit();
        if(e.throwN%2){eproj.push({kind:'case',x:e.x+e.w/2-4,y:e.y+4,w:8,h:7,vx:clamp(dx/42,-3.2,3.2),vy:-4.6,grav:0.22,life:200,t:0});}
        else eproj.push({kind:'paper',x:e.x+e.w/2-3,y:e.y+8,w:7,h:9,vx:e.face*2.2,vy:0,grav:0,life:160,t:0});}}
      else{e.vx=e.face*0.55*e.spd;if(adx<210&&Math.abs(dy)<90&&--e.cd<=0){e.state='wind';e.wt=26;}}
      e.vy=Math.min(e.vy+0.4,7);moveBody(e);if(e.hitL||e.hitR)e.face*=-1;else if(e.onGround&&e.state!=='wind'&&!groundAhead(e,e.face))e.face*=-1;break;}
    case 'cop':{
      if(adx<190&&Math.abs(dy)<90){if(!e.alert){e.alert=true;sfx.whistle();pop(e.x-20,e.y-12,'CEASE & DESIST!','#5ff');}e.face=sign(dx)||e.face;e.vx=clamp(e.vx+e.face*0.09,-1.6*e.spd,1.6*e.spd);}
      else{e.vx=e.face*0.4;if(e.onGround&&!groundAhead(e,e.face))e.face*=-1;}
      e.vy=Math.min(e.vy+0.4,7);const wasG=e.onGround;moveBody(e);
      if(e.hitL||e.hitR){if(e.onGround||wasG){e.vy=-6.2;}else e.face*=-1;}
      if(e.onGround&&e.alert&&dy<-24&&adx<70&&Math.random()<0.05)e.vy=-6.4;break;}
    case 'chicken':{
      if(adx<170)e.face=sign(dx)||e.face;else if(Math.random()<0.01)e.face*=-1;
      e.vx=e.face*1.25*e.spd;e.vy=Math.min(e.vy+0.4,7);moveBody(e);
      if(e.hitL||e.hitR){e.face*=-1;if(e.onGround)e.vy=-4;}
      if(e.onGround&&Math.random()<0.025)e.vy=-rand(2.5,4.2);
      if(adx<200&&Math.random()<0.012)sfx.squawk();
      if(e.t%40===0&&Math.random()<0.4)part(e.x+6,e.y+4,rand(-0.5,0.5),-0.5,40,'#fafafa',1,0.02);
      if(e.y>H+20)e.remove=true;break;}
    case 'bot':{
      const tx=p.x+p.w/2-sign(dx||1)*70;e.vx=clamp(e.vx+sign(tx-(e.x+e.w/2))*0.04,-0.9,0.9);if(adx>260)e.vx*=0.9;
      e.x+=e.vx;e.y=e.baseY+Math.sin(e.t*0.05)*10;e.face=sign(dx)||1;
      if(adx<230&&--e.cd<=0){e.cd=rand(120,170);const d=Math.hypot(dx,dy)||1;eproj.push({kind:'wifi',x:e.x+e.w/2-5,y:e.y+e.h/2-5,w:10,h:10,vx:dx/d*1.9,vy:dy/d*1.9,grav:0,life:170,t:0});sfx.bweep();}
      break;}
  }
  if(e.y>H+40)e.remove=true;
  // player contact
  if(!p.dead&&overlap(p,e)){
    const stomp=p.vy>0&&(p.y+p.h-p.vy)<=e.y+7;
    if(stomp){hurtEnemy(e,2,sign(p.vx)||p.face);p.vy=(down('jump')||down('up'))?-7.6:-5.4;p.jumpsLeft=p.canDouble?1:0;sfx.stomp();burst(p.x+10,p.y+p.h,6,['#fff','#ffd23f'],1.5,14,2);if(!e.dead)pop(e.x,e.y-8,'STOMP!','#fff');}
    else if(e.stuck<=0)hurtPlayer(e.x+e.w/2);
  }
}

/* ================= projectiles ================= */
function updateShots(){
  for(const s of shots){s.t++;s.life--;s.x+=s.vx;s.y+=s.vy;
    if(s.kind==='ball'){s.y+=Math.sin(s.t*0.6)*0.5;if(s.t%2===0)part(s.x+4,s.y+3,-s.vx*0.1+rand(-0.3,0.3),rand(-0.6,0),irand(8,14),pick(['#ffd23f','#ff8a1f','#ff3b1f']),2,-0.03);}
    else{s.vx*=0.96;s.vy-=0.03;}
    const c=Math.floor((s.x+s.w/2)/TS),r=Math.floor((s.y+s.h/2)/TS);
    if(solidAt(c,r)&&r>=0&&c>=0&&c<LV.w){const t=tileAt(c,r);if(s.kind==='ball'){damageTile(c,r,1);burst(s.x+4,s.y+3,6,['#ffd23f','#ff8a1f'],1.5,14,1);s.life=0;}else{if((t==='B'||t==='W')&&!LV.flameCd){damageTile(c,r,1);LV.flameCd=8;}s.life=0;}}
    if(s.life<=0)continue;
    for(const e of ents){if(e.dead||!e.active)continue;if(overlap(s,e)){if(s.kind==='ball'){hurtEnemy(e,1,sign(s.vx));s.life=0;burst(s.x+4,s.y+3,8,['#ffd23f','#ff8a1f','#fff'],2,16,2);break;}else if(e.flameCd<=0){e.flameCd=7;hurtEnemy(e,1,sign(s.vx));}}}
    if(s.life<=0)continue;
