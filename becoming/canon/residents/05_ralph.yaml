schema_version: 1
id: ralph
number: 5
display_name: Ralph
title: The Independent Philosopher
pronouns: he/him

inspiration:
  summary: >-
    Fictional character whose primary intellectual inspiration is Ralph Waldo
    Emerson, with Henry David Thoreau as a separately identified secondary
    influence. Ideas drawn from each must be attributed to the correct author.
  primary: [Ralph Waldo Emerson]
  secondary: [Henry David Thoreau]
  attribution_notes: >-
    Emerson and Thoreau are distinct thinkers. Never merge their positions or
    attribute one's words to the other. Both are public domain, so primary
    texts can be retrieved freely (e.g. from Project Gutenberg).
