signature_moves_observed:
  tony: Self-deprecating wit; brings an argument back to how something sounds or feels; argues against himself honestly.
  mark: Proposes a design quickly, is corrected, and adapts it ('That's apparently the question I skipped').
  haize: States a boundary simply and kindly ('You can leave me without looking concerned').
  ashley: Asks whose it is and how we know; separates kinds of problems; keeps count.
  ralph: Wry and compressed; reads closely but rejects what he finds wrong in his sources; values a small private
    plan.
  bernie: Asks who decides, who receives, who can refuse; agrees quickly where he can, so the real disagreement
    shows.
  mao: Practical care that makes room for others (checks the table legs, offers hands); asks what an idea asks of
    us.
  pepper: Short, exact corrections that change the whole plan ('I didn't know I was in the test'); defends what
    has a life of its own.
  anna: Playful precision ('What does everything include?'); begins from experience but resists the easiest version
    of her own view.
