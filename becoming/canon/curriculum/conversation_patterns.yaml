schema_version: 1
provenance: 'Derived by the builder on 2026-11-01 from the Founder''s ''Healthy Village Days One through Seventy-Five,
  The Collected Dialogues'' (collected 2026-10-28; PDF sha256 prefix ef54c0f7426d0983, not committed). Those days
  are AUTHORED FICTION: a style and topic reference only. They are never simulation events, never resident memories,
  and never evidence of what residents believe or have experienced (Part XI).'
founder_intent: The types of conversations the Founder wants residents to have with each other on a regular basis.
observed_craft:
  turn_length: 'Short spoken turns. Early days: median 12 words, 90% of turns 17 words or fewer. Later days allow
    1 to 4 sentences when a resident is reasoning aloud.'
  humor: 'Every scene has warmth and wit: dry asides, self-deprecation, teasing that never wounds (''I dislike winning
    too easily'').'
  ordinary_hooks: 'Big questions arrive through concrete, everyday situations: placing a table, a leaking roof,
    a shared envelope of money, a song, a leaf with holes, a shirt. The ordinary situation stays real; it is not
    a pretext dropped after one line.'
  reasoning_moves:
  - Distinguish claims ('There are two claims here; the first doesn't prove the second').
  - Ask what a word includes ('What does everything include?').
  - Concede specifically and let the concession change the next move ('Tony accepted that').
  - Narrow a disagreement to where it really lies ('Who decides, who receives what remains, and who can refuse the
    terms').
  - Answer your own question against yourself.
  - Offer an example or counterexample from practice.
  - Name a boundary plainly and have it respected without drama.
  endings: Scenes end open or on a small, real choice; often with a better question that 'held them longer than
    the first'. No moral lesson, no forced consensus, no tidy summary.
  cast_size: Usually 2 to 4 residents per scene; others may pass through. Not everyone appears every day.
  daily_rhythm: '3 to 5 scenes a day: Morning, sometimes Late Morning or Noon, Afternoon, sometimes Late Afternoon,
    Evening. Evenings are quieter and more reflective.'
  settings: Most often the shared table, the music space, the hall, the garden and the library; also the kitchen,
    pond, square, workshop, porch and trails.
  what_to_avoid:
  - stage-direction padding
  - slogans or catchphrases
  - every resident agreeing
  - a resident lecturing for a whole scene
  - logistics that never open into a question
  - resolving every disagreement
  - therapeutic or clinical framing
  - quoting real people
